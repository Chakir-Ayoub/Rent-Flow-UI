<app-activity-form></app-activity-form>
<section class="pt-4 flex flex-col gap-4" id="liste-activites">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-outline-variant/40 pb-3">
    <div>
      <h3 class="text-xl font-bold text-primary flex items-center gap-2">
        <span class="material-symbols-outlined text-secondary">format_list_bulleted</span>
        Existing activities for {{propertyName}}
        <span class="text-xs px-2.5 py-0.5 rounded-full bg-surface-container-high text-primary font-bold border border-outline-variant/30">
              4 au total
            </span>
      </h3>
    </div>
    <div class="flex items-center gap-2">
      <div class="relative">
        <span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-sm text-on-surface-variant">search</span>
        <input class="text-xs pl-8 pr-3 py-1.5 rounded-lg border border-outline-variant/50 bg-surface-container-lowest focus:ring-1 focus:ring-secondary outline-none w-48 sm:w-60" placeholder="Filter a service..." type="text"/>
      </div>
      <button class="p-1.5 rounded-lg border border-outline-variant/50 hover:bg-surface-container-high text-primary" title="Refresh the data">
        <span class="material-symbols-outlined text-base">refresh</span>
      </button>
    </div>
  </div>
  <!-- Table Container -->
  <div class="bg-surface-container-lowest rounded-xl border border-outline-variant/50 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
        <tr class="bg-surface-container text-primary text-[11px] font-bold uppercase tracking-wider border-b border-outline-variant/40">
          <th class="py-3 px-4">Title of the Service</th>
          <th class="py-3 px-4">Description</th>
          <th class="py-3 px-4 text-right">Price</th>
          <th class="py-3 px-4 text-center">Status</th>
          <th class="py-3 px-4 text-right">Actions</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-outline-variant/30 text-xs" *ngFor="let activity of activities">
        <!-- Item 1 -->
        <tr class="hover:bg-surface-container-low/50 transition-colors"  >
          <td class="py-3.5 px-4 font-semibold text-primary">
            <div class="flex items-center gap-2.5" >
              <div>
                <span class="font-bold text-on-surface block">{{activity.title}}</span>
              </div>
            </div>
          </td>
          <td class="py-3.5 px-4 text-on-surface-variant max-w-md font-mono text-xs">
            {{activity.description}}
          </td>
          <td class="py-3.5 px-4 text-right font-bold text-primary font-mono text-sm">
            {{activity.price}}€
          </td>
          <td class="py-3.5 px-4 text-center">
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">
                    ● Actif
                  </span>
          </td>
          <td class="py-3.5 px-4 text-right">
            <div class="flex items-center justify-end gap-1.5">
            <!--  <button class="p-1.5 text-on-surface-variant hover:text-secondary rounded hover:bg-surface-container-high transition-colors" title="Modifier l'activité">
                <span class="material-symbols-outlined text-base">edit</span>
              </button>-->
              <button class="p-1.5 text-on-surface-variant hover:text-error rounded hover:bg-error-container/30 transition-colors" (click)="deleteActivity(activity)" title="Tester DELETE /{propertyCode}">
                <span class="material-symbols-outlined text-base">delete</span>
              </button>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <!-- Table Pagination/Info -->
    <div class="px-5 py-3 bg-surface-container-low border-t border-outline-variant/30 flex items-center justify-between text-xs text-on-surface-variant">
      <span>Displaying 4 out of 4 services recorded for code {{propertyName}}</span>
      <div class="flex items-center gap-1 font-semibold text-primary">
        <button (click)="getActivities()">
          <span class="material-symbols-outlined text-base">sync</span>
          <span>Automatic synchronization (60s cache)</span>
        </button>

      </div>
    </div>
  </div>
</section>
